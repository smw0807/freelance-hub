name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: DockerHub Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD

      - name: Pull latest image
        run: docker pull smw0807/freelance-hub-backend:1.0.0

      - name: Stop and remove old container
        run: |
          docker stop freelance-hub-backend || true
          docker rm freelance-hub-backend || true

      - name: Run new container
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_PORT: ${{ secrets.APP_PORT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
        run: |
          docker run -d \
            --name freelance-hub-backend \
            --restart always \
            -e NODE_ENV="$NODE_ENV" \
            -e APP_NAME="$APP_NAME" \
            -e APP_PORT="$APP_PORT" \
            -e DATABASE_URL="$DATABASE_URL" \
            -e FRONTEND_URL="$FRONTEND_URL" \
            -e CORS_ORIGINS="$CORS_ORIGINS" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e KAKAO_CLIENT_ID="$KAKAO_CLIENT_ID" \
            -e KAKAO_REDIRECT_URI="$KAKAO_REDIRECT_URI" \
            -p 3000:3000 \
            smw0807/freelance-hub-backend:1.0.0
