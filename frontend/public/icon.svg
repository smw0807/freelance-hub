  <line x1="200" y1="256" x2="148" y2="256" stroke="white" stroke-width="20" stroke-linecap="round"/>

  <!-- Outer nodes -->
  <circle cx="256" cy="112" r="36" fill="white" opacity="0.85"/>
  <circle cx="400" cy="256" r="36" fill="white" opacity="0.85"/>
  <circle cx="256" cy="400" r="36" fill="white" opacity="0.85"/>
  <circle cx="112" cy="256" r="36" fill="white" opacity="0.85"/>

